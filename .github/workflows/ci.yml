name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- primary build + unit/golden tests ---
  build-and-test:
    name: build + test (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        id: build
      # --continue: Turbo otherwise stops every other package's tests at the
      # first failing package, so one failure hides the next. The job still
      # fails if any package fails.
      # ZLENS_AGENT_TEST_LANE=ordinary: dql-agent runs only its ordinary lane
      # here; its heavy lane runs in the next step (see there).
      - run: pnpm test -- --continue
        env:
          ZLENS_AGENT_TEST_LANE: ordinary
      # The dql-agent heavy lane (catalog.test.ts, project-state.test.ts)
      # builds 4,000-model indexes and asserts a wall-clock retrieval bound
      # (PERF-001/PERF-002). Inside `pnpm test` it shared the runner with the
      # CLI suite and measured about three times slower, so it runs here on
      # its own, after every other suite has finished. It runs even when the
      # step above failed, so one red run reports both.
      - name: dql-agent heavy lane (alone)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @zlens/agent run test:heavy

  # --- the DuckDB driver on every supported Node (RFC 0011) ---
  # @duckdb/node-api ships a Node-API binary per platform, so the same install
  # loads on every Node from 20 up. Run the connector's real-driver tests on
  # each, including Node 26 LTS, which the old `duckdb` package could not
  # install without compiling DuckDB. A skipped case fails the job.
  duckdb-driver:
    name: duckdb driver (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zlens/connectors... build
      - name: Install the DuckDB driver as ZLens does (no install script, nothing compiled)
        run: |
          mkdir -p "$CONNECTOR_ROOT"
          printf '%s\n' '{"private":true}' > "$CONNECTOR_ROOT/package.json"
          npm --prefix "$CONNECTOR_ROOT" install --no-save --no-package-lock --workspaces=false '@duckdb/node-api@^1.5.6-r.1' 2>&1 | tee "$RUNNER_TEMP/driver-install.log"
          if grep -qiE 'node-gyp|gyp info|prebuild-install' "$RUNNER_TEMP/driver-install.log"; then
            echo "Installing the DuckDB driver compiled or downloaded a native build." >&2
            exit 1
          fi
        env:
          CONNECTOR_ROOT: ${{ runner.temp }}/duckdb-connector
      - name: DuckDB connector tests against the real driver
        working-directory: packages/dql-connectors
        shell: bash
        run: |
          npx vitest run src/drivers/duckdb.test.ts src/drivers/duckdb-file-handle.test.ts src/drivers/duckdb-disconnect.test.ts src/drivers/file.test.ts --reporter=verbose | tee "$RUNNER_TEMP/duckdb-driver.log"
          if grep -qE '[0-9]+ skipped' "$RUNNER_TEMP/duckdb-driver.log"; then
            echo "DuckDB driver tests skipped cases although the driver root was configured." >&2
            exit 1
          fi
          # Lake tables at scale (open-formats plan L4): sizes from footers and the read budget, on the real driver.
          (cd ../../apps/cli && npx vitest run src/lake-scale.duckdb.test.ts --reporter=verbose) | tee "$RUNNER_TEMP/lake-scale.log"
          if grep -qE '[0-9]+ skipped' "$RUNNER_TEMP/lake-scale.log"; then
            echo "The lake scale test skipped although the driver root was configured." >&2
            exit 1
          fi
        env:
          ZLENS_APP_DATASETS_DUCKDB_CONNECTOR_ROOT: ${{ runner.temp }}/duckdb-connector

  # --- A lake in a bucket: the file connection over an S3 API (moto) ---
  # The lake fixtures (Delta, Iceberg written elsewhere) are copied into a
  # bucket, and a file connection reads it by name: a bucket data folder,
  # named sources, DuckDB writing partitioned Parquet into the bucket.
  lake-s3:
    name: lake in a bucket (S3 API)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zlens/connectors... build
      - name: Start an S3 API (moto) and copy the lake fixtures into a bucket
        run: |
          python3 -m venv "$RUNNER_TEMP/moto"
          "$RUNNER_TEMP/moto/bin/pip" install --quiet 'moto[server]==5.1.4'
          nohup "$RUNNER_TEMP/moto/bin/moto_server" -H 127.0.0.1 -p 9000 > "$RUNNER_TEMP/moto.log" 2>&1 &
          up=no
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:9000/ && { up=yes; break; }; sleep 1; done
          if [ "$up" != yes ]; then cat "$RUNNER_TEMP/moto.log"; echo "The S3 API did not start." >&2; exit 1; fi
          aws --endpoint-url http://127.0.0.1:9000 s3 mb s3://zlens-test
          aws --endpoint-url http://127.0.0.1:9000 s3 cp --recursive --quiet packages/dql-connectors/test/fixtures/lake s3://zlens-test/lake
        env:
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_DEFAULT_REGION: us-east-1
      - name: Install the DuckDB driver as ZLens does
        run: |
          mkdir -p "$CONNECTOR_ROOT"
          printf '%s\n' '{"private":true}' > "$CONNECTOR_ROOT/package.json"
          npm --prefix "$CONNECTOR_ROOT" install --no-save --no-package-lock --workspaces=false '@duckdb/node-api@^1.5.6-r.1'
        env:
          CONNECTOR_ROOT: ${{ runner.temp }}/duckdb-connector
      - name: Read the lake in the bucket
        working-directory: packages/dql-connectors
        shell: bash
        run: |
          npx vitest run src/drivers/lake-s3.test.ts --reporter=verbose | tee "$RUNNER_TEMP/lake-s3.log"
          # moto accepts any keys, so only the wrong-keys case may skip; the lake itself must be read.
          grep -q '1 passed' "$RUNNER_TEMP/lake-s3.log" || { echo "The bucket lake test did not run." >&2; exit 1; }
        env:
          ZLENS_APP_DATASETS_DUCKDB_CONNECTOR_ROOT: ${{ runner.temp }}/duckdb-connector
          ZLENS_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          ZLENS_TEST_S3_BUCKET: zlens-test
          ZLENS_TEST_S3_KEY_ID: testing
          ZLENS_TEST_S3_SECRET: testing

  # --- Lake catalogs: a file connection attaches catalog services ---
  # Real catalog servers, no Docker: Lakekeeper (an Iceberg REST catalog; a
  # pinned release binary) with its warehouse in an S3 API (moto) and its own
  # catalog in the runner's Postgres; Unity Catalog OSS (from Maven Central)
  # with a Delta table registered; DuckLake with its catalog in Postgres.
  lake-catalogs:
    name: lake catalogs (Iceberg REST, Unity, DuckLake)
    runs-on: ubuntu-24.04
    env:
      LAKEKEEPER_VERSION: v0.14.2
      LAKEKEEPER_SHA256: e1eb2de75f95c1124f91ed32bfd14bcbddf906f91651bbd446ad9a0af99251b8
      COURSIER_VERSION: v2.1.24
      COURSIER_SHA256: d2c0572a17fb6146ea65349b59dd216b38beff60ae22bce6e549867c6ed2eda6
      UNITY_CATALOG_VERSION: 0.3.0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zlens/connectors... build
      - name: Start Postgres (the runner's own) with a user and two databases
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE zlens LOGIN PASSWORD 'ci-pg-secret-41' CREATEDB"
          sudo -u postgres createdb -O zlens lakekeeper
          sudo -u postgres createdb -O zlens ducklake
      # moto listens on 9020: Lakekeeper's own metrics server takes 9000.
      - name: Start an S3 API (moto) with the warehouse bucket
        run: |
          python3 -m venv "$RUNNER_TEMP/moto"
          "$RUNNER_TEMP/moto/bin/pip" install --quiet 'moto[server]==5.1.4'
          nohup "$RUNNER_TEMP/moto/bin/moto_server" -H 127.0.0.1 -p 9020 > "$RUNNER_TEMP/moto.log" 2>&1 &
          up=no
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:9020/ && { up=yes; break; }; sleep 1; done
          if [ "$up" != yes ]; then cat "$RUNNER_TEMP/moto.log"; echo "The S3 API did not start." >&2; exit 1; fi
          aws --endpoint-url http://127.0.0.1:9020 s3 mb s3://warehouse
        env:
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_DEFAULT_REGION: us-east-1
      - name: Start Lakekeeper (Iceberg REST) with a warehouse on the S3 API
        run: |
          cd "$RUNNER_TEMP"
          curl -sfL -o lakekeeper.tar.gz "https://github.com/lakekeeper/lakekeeper/releases/download/${LAKEKEEPER_VERSION}/lakekeeper-x86_64-unknown-linux-gnu.tar.gz"
          echo "${LAKEKEEPER_SHA256}  lakekeeper.tar.gz" | sha256sum -c -
          tar xzf lakekeeper.tar.gz
          ./lakekeeper migrate
          nohup ./lakekeeper serve > lakekeeper.log 2>&1 &
          up=no
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8181/health && { up=yes; break; }; sleep 1; done
          if [ "$up" != yes ]; then cat lakekeeper.log; echo "Lakekeeper did not start." >&2; exit 1; fi
          curl -sf -X POST http://127.0.0.1:8181/management/v1/bootstrap -H 'content-type: application/json' -d '{"accept-terms-of-use": true}'
          curl -sf -X POST http://127.0.0.1:8181/management/v1/warehouse -H 'content-type: application/json' -d '{
            "warehouse-name": "ci",
            "storage-profile": {"type": "s3", "bucket": "warehouse", "region": "us-east-1", "endpoint": "http://127.0.0.1:9020", "path-style-access": true, "sts-enabled": false, "flavor": "s3-compat"},
            "storage-credential": {"type": "s3", "credential-type": "access-key", "aws-access-key-id": "testing", "aws-secret-access-key": "testing"}
          }' || { cat lakekeeper.log; exit 1; }
        env:
          LAKEKEEPER__PG_DATABASE_URL_READ: postgres://zlens:ci-pg-secret-41@127.0.0.1:5432/lakekeeper
          LAKEKEEPER__PG_DATABASE_URL_WRITE: postgres://zlens:ci-pg-secret-41@127.0.0.1:5432/lakekeeper
          LAKEKEEPER__PG_ENCRYPTION_KEY: ci-only-not-a-secret-0123456789abcdef
          LAKEKEEPER__LISTEN_PORT: '8181'
          LAKEKEEPER__BASE_URI: http://127.0.0.1:8181
      - name: Start Unity Catalog OSS (from Maven Central)
        run: |
          mkdir -p "$RUNNER_TEMP/unity/etc/conf" && cd "$RUNNER_TEMP/unity"
          curl -sfL -o cs.gz "https://github.com/coursier/coursier/releases/download/${COURSIER_VERSION}/cs-x86_64-pc-linux.gz"
          echo "${COURSIER_SHA256}  cs.gz" | sha256sum -c -
          gzip -d cs.gz && chmod +x cs
          ./cs fetch "io.unitycatalog:unitycatalog-server:${UNITY_CATALOG_VERSION}" --classpath > classpath.txt
          printf '%s\n' 'server.env=dev' 'server.authorization=disable' 'storage-root.models=file:/tmp/ucroot' > etc/conf/server.properties
          printf '%s\n' 'hibernate.connection.driver_class=org.h2.Driver' 'hibernate.connection.url=jdbc:h2:file:./etc/db/h2db;DB_CLOSE_DELAY=-1' 'hibernate.hbm2ddl.auto=update' 'hibernate.show_sql=false' 'hibernate.archive.autodetection=class' > etc/conf/hibernate.properties
          nohup java -cp "$(cat classpath.txt)" io.unitycatalog.server.UnityCatalogServer -p 8080 > unity.log 2>&1 &
          up=no
          for i in $(seq 1 90); do curl -sf -o /dev/null http://127.0.0.1:8080/api/2.1/unity-catalog/catalogs && { up=yes; break; }; sleep 1; done
          if [ "$up" != yes ]; then tail -50 unity.log; echo "Unity Catalog did not start." >&2; exit 1; fi
      - name: Install the DuckDB driver as ZLens does
        run: |
          mkdir -p "$CONNECTOR_ROOT"
          printf '%s\n' '{"private":true}' > "$CONNECTOR_ROOT/package.json"
          npm --prefix "$CONNECTOR_ROOT" install --no-save --no-package-lock --workspaces=false '@duckdb/node-api@^1.5.6-r.1'
        env:
          CONNECTOR_ROOT: ${{ runner.temp }}/duckdb-connector
      - name: Read the catalogs through a file connection
        working-directory: packages/dql-connectors
        shell: bash
        run: |
          npx vitest run src/drivers/lake-catalogs.test.ts --reporter=verbose | tee "$RUNNER_TEMP/lake-catalogs.log"
          # Every catalog must be read: none may skip.
          grep -q '3 passed' "$RUNNER_TEMP/lake-catalogs.log" || { echo "Not every catalog test ran." >&2; exit 1; }
        env:
          ZLENS_APP_DATASETS_DUCKDB_CONNECTOR_ROOT: ${{ runner.temp }}/duckdb-connector
          ZLENS_TEST_ICEBERG_REST_ENDPOINT: http://127.0.0.1:8181/catalog
          ZLENS_TEST_ICEBERG_REST_WAREHOUSE: ci
          ZLENS_TEST_S3_ENDPOINT: http://127.0.0.1:9020
          ZLENS_TEST_S3_KEY_ID: testing
          ZLENS_TEST_S3_SECRET: testing
          ZLENS_TEST_UNITY_ENDPOINT: http://127.0.0.1:8080
          ZLENS_TEST_DUCKLAKE_POSTGRES: dbname=ducklake host=127.0.0.1 port=5432 user=zlens
          # A password no name contains: the test checks it is never shown.
          ZLENS_TEST_DUCKLAKE_PASSWORD: ci-pg-secret-41

  # --- create-zlens-app smoke test ---
  # Guards the "5 minutes to first dashboard" demo gate.
  scaffold-smoke:
    name: create-zlens-app smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node packages/create-dql-app/test/smoke.mjs

  # --- Docker quickstart: the documented `docker compose up` must start ---
  # Builds the image from the compose file and checks /api/health with the
  # server token the quickstart tells users to set. A non-loopback binding
  # without ZLENS_SERVER_TOKEN makes the container exit, so this fails if the
  # compose file or the docs drift from the runtime.
  docker-image:
    name: docker image health
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: build and start with docker compose
        env:
          ZLENS_SERVER_TOKEN: ci-health-check-token
        run: docker compose up -d --build notebook
      - name: wait for /api/health
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3474/api/health || true)
            if [ "$code" = "200" ]; then
              echo "health ok after ${i} tries"
              exit 0
            fi
            sleep 2
          done
          echo "health check did not return 200 (last code: ${code})"
          exit 1
      - name: container logs
        if: ${{ failure() }}
        env:
          ZLENS_SERVER_TOKEN: ci-health-check-token
        run: docker compose logs notebook
      - name: stop
        if: ${{ always() }}
        env:
          ZLENS_SERVER_TOKEN: ci-health-check-token
        run: docker compose down

  # --- docs: every relative link resolves; every documented command is real ---
  docs:
    name: docs link check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: check relative links in docs/
        run: node scripts/check-doc-links.mjs
      - name: check every documented zlens command and flag is real
        run: |
          node --test scripts/check-doc-commands.test.mjs
          node scripts/check-doc-commands.mjs
      - name: table names are compared in one place (simplification plan Z1)
        run: |
          node --test scripts/check-table-names.test.mjs
          node scripts/check-table-names.mjs

  # --- zlens fmt --check across the repo ---
  # Gates canonical .dql serialization — catches whitespace churn before
  # it reaches main.
  format-check:
    name: zlens fmt --check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: zlens fmt --check
        run: |
          set -e
          shopt -s globstar nullglob
          files=(packages/create-dql-app/templates/**/*.dql apps/cli/test/fixtures/**/*.dql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no .dql files to check — skipping"
            exit 0
          fi
          # Kept byte-for-byte on purpose: the committed commerce-pilot App
          # (app-datasets-pilot/apps/commerce-pilot/dashboards/*.dqld) pins
          # this block's sourceRevision, a hash of the file. Reformatting it
          # makes the pilot tests report source drift, so it is skipped here
          # until the App's pinned revisions are regenerated with it.
          pinned=apps/cli/test/fixtures/app-datasets-pilot/domains/commerce/blocks/order-lines-dataset.dql
          for f in "${files[@]}"; do
            if [ "$f" = "$pinned" ]; then
              echo "  - Skipped (sourceRevision pinned by the commerce-pilot App): $f"
              continue
            fi
            node apps/cli/dist/index.js fmt --check "$f"
          done

  # --- Golden answer-routing eval ---
  # CI-safe W4.1 gate: deterministic router eval over certified, generated, and
  # safe-refusal cases. Deeper `zlens agent eval --execute` suites can run in
  # credentialed/project CI, but this keeps every PR honest without live AI keys.
  golden-eval:
    name: golden eval (router)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: zlens eval golden fixtures
        run: |
          node apps/cli/dist/index.js eval apps/cli/test/fixtures/lineage-app \
            --format json \
            --min-route-accuracy 1 \
            --min-refusal 1 \
            --min-answer-rate 1
          node apps/cli/dist/index.js eval apps/cli/test/fixtures/jaffle-supply-chain \
            --format json \
            --min-route-accuracy 1 \
            --min-refusal 1 \
            --min-answer-rate 1
      # jaffle-golden's questions through the router with dbt (jaffle-golden)
      # and without (jaffle-warehouse-golden: synced catalog, certified joins).
      # Reports both scores in the job summary; fails only when the
      # warehouse-only score drops below floor.router in the committed
      # baseline. The Ask-pipeline half of this eval (rows and trust, replayed
      # cassettes) is src/ask-golden-jaffle-warehouse.test.ts in `pnpm test`.
      - name: jaffle-golden questions, dbt vs no dbt (router)
        run: |
          node --test scripts/eval-golden-router-compare.test.mjs
          node scripts/eval-golden-router-compare.mjs \
            --check apps/cli/test/ask-golden/jaffle-warehouse-golden/baseline.json

  # --- MCP server, every tool, no model ---
  # Starts the BUILT `zlens mcp` over stdio with the official MCP SDK client
  # (as Claude Code, Codex, Cursor and Claude Desktop do) against copies of the
  # jaffle dbt, warehouse-only and App Dataset fixtures, each with its own
  # `zlens notebook` runtime and a seeded DuckDB file, and calls every tool of
  # both profiles with valid and invalid input: right result, trust label,
  # clear errors (MCP isError), and no call left hanging.
  mcp-stdio:
    name: mcp every tool (stdio, no model)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install a disposable DuckDB connector
        run: |
          mkdir -p "$CONNECTOR_ROOT"
          printf '%s\n' '{"private":true}' > "$CONNECTOR_ROOT/package.json"
          npm --prefix "$CONNECTOR_ROOT" install --no-save --no-package-lock --workspaces=false '@duckdb/node-api@^1.5.6-r.1'
        env:
          CONNECTOR_ROOT: ${{ runner.temp }}/mcp-duckdb-connector
      - name: every MCP tool over stdio
        run: node packages/dql-mcp/scripts/stdio-e2e.mjs --connector-root "$RUNNER_TEMP/mcp-duckdb-connector" --json "$RUNNER_TEMP/mcp-stdio.json"
      - name: upload results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mcp-stdio-results
          path: ${{ runner.temp }}/mcp-stdio.json
          retention-days: 14

  # --- 4,000-model stress test (perf gate) ---
  # Gates: cold <30s, warm <2s. See docs/contribute/testing.md.
  stress-test:
    name: stress (4k-model synthetic project)
    runs-on: ubuntu-24.04
    # Only run on main branch pushes — expensive.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: generate 4,000-model synthetic dbt project
        run: node scripts/bench/gen-dbt-project.mjs --models 4000 --out /tmp/stress
      - name: run benchmark (gates cold <30s, warm <2s)
        run: ZLENS_CLI="node $PWD/apps/cli/dist/index.js" node scripts/bench/run-bench.mjs /tmp/stress

  # --- Real-browser E2E (notebook smoke journeys) ---
  # Drives the BUILT `zlens notebook` CLI in headless Chromium on every PR and
  # push (AGENTS.md: Vite-only proof is not acceptance). The suite's global
  # setup seeds a temp copy of the jaffle fixture and starts the server with
  # cassette replay, so no live model is ever called.
  e2e:
    name: playwright e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm -F @zlens/notebook-app exec playwright install --with-deps chromium
      - run: pnpm -F @zlens/notebook-app test:e2e
        env:
          CI: "true"
          E2E_SKIP_BUILD: "1"
      - name: upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/dql-notebook/playwright-report/
            apps/dql-notebook/test-results/
          retention-days: 7

  # --- summary gate for branch protection ---
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-24.04
    needs: [build-and-test, duckdb-driver, scaffold-smoke, docs, format-check, golden-eval, e2e, mcp-stdio]
    steps:
      - run: echo "All required CI gates passed."
