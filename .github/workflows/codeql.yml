# Static analysis for security issues (CodeQL), on every change to main, every pull request and once a
# week. Findings show under Security » Code scanning. docs/security/secure-development.md
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 10 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
