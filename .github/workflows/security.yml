# Supply-chain checks (docs/security/secure-development.md): production dependencies carry no high or
# critical advisory. Runs on every change and once a week, since new advisories land on code that has
# not changed. Fix by upgrading, or with a pnpm override in package.json; a finding that cannot be fixed
# yet goes in docs/security/cve-exceptions.md with why it is not reachable.
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 11 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: dependency audit (production, high and critical)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: no high or critical advisories in production dependencies
        run: pnpm audit --prod --audit-level high
