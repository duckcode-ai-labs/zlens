# ZLens video tutorials on YouTube (https://www.youtube.com/@zlensanalytics).
#
# One entry per video. Pages show a video with a marker on a line of its own:
#
#     {{ video("qs1-install") }}
#
# and the Video tutorials page lists every playlist with {{ videos() }}
# (scripts/mkdocs/videos.py). Thumbnails live in docs/media/videos/<id>.jpg
# (480x270). `note` is shown under the link when the video differs from the
# current product; keep it to one sentence.

playlists:
  - key: intro
    title: Start here
    youtube: PLKzfNDl3I2sI
    summary: The whole idea in 90 seconds.
  - key: quick-start
    title: Quick Start
    youtube: PLOQWt259Y25k
    summary: From install to your first trusted answer, on the Jaffle Shop sample or your own data.
  - key: notebooks
    title: Notebooks
    youtube: PLUdJRzKhNIRA
    summary: SQL, charts, inputs and AI in one file you share and review in git.
  - key: blocks
    title: Saved queries and certification
    youtube: PLRvLK1Q_JFQA
    summary: Saved queries your team can trust, and how a person certifies them.
  - key: ask
    title: Ask and trust
    youtube: PLahuj-J7h3TY
    summary: How Ask picks a source, what each label means, and when it refuses.
  - key: semantic
    title: Semantic layer
    youtube: PLXjz0fV3orFg
    summary: Define a metric once, and certify how tables join.
  - key: lineage
    title: Lineage
    youtube: PLJIc5kBRmBLs
    summary: Trace a number to its source, and see what a change will break.
  - key: git
    title: Share and review with git
    youtube: PLZGwS382JLAs
    summary: Review data work like code, without learning git commands.
  - key: agents
    title: Your AI agent + ZLens
    youtube: PLJSaxF-L_t4Q
    summary: Use ZLens from Claude Code, Claude Desktop, Codex and Cursor.
  - key: evals
    title: Evals and CI
    youtube: PLcTI7I6RUs-4
    summary: Test your AI answers like code, on every pull request.
  - key: apps
    title: Apps
    youtube: PLBI3ZFFvskKQ
    summary: Dashboards that show their proof.

videos:
  zlens-agentic-film: {playlist: intro, youtube: nsyLc4UfKxo, length: "1:30", title: "ZLens: certified agentic analytics, explained in 90 seconds", docs: index.md, note: "The end card omits the folder name: run npx create-zlens-app@latest my-analytics, or start with the Quickstart."}

