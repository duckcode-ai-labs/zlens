manifest_version: 2
artifacts:
  setup_script: setup.sql
  readme: README.md
  default_web_endpoint:
    service: core.zlens
    endpoint: ui
  container_services:
    images:
    - <% ctx.env.ZLENS_IMAGE %>
snowflake_database:
  roles:
  - CORTEX_USER:
      description: "Ask questions with Claude through Snowflake Cortex, inside your account."
privileges:
- BIND SERVICE ENDPOINT:
    description: "Open ZLens in the browser at its own Snowflake address."
- CREATE COMPUTE POOL:
    description: "Run ZLens in one small compute pool in your account."
- CREATE WAREHOUSE:
    description: "Its own extra-small warehouse for ZLens's queries (it suspends after 60 seconds idle)."
