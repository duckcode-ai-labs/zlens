# The ZLens app for Snowflake (the free, one-person app): `snow app run` builds the package and
# installs it in development mode. ZLENS_IMAGE names the ZLens image in your image repository,
# e.g. /zlens_dev/app/images/zlens:0.3.1 (see README.md).
definition_version: 2
entities:
  # Development: `snow app run` installs it in development mode. INTERNAL: never leaves this account.
  zlens_package:
    type: application package
    identifier: ZLENS_PACKAGE
    distribution: internal
    manifest: app/manifest.yml
    artifacts:
      - src: app/*
        dest: ./
        processors:
          - templates
  zlens_app:
    type: application
    identifier: ZLENS_APP
    from:
      target: zlens_package
    debug: false
  # The package customers install from (a Marketplace listing). EXTERNAL: every version Snowflake
  # scans before it can be released; versions only, never development mode (see RELEASING.md).
  zlens_release:
    type: application package
    identifier: ZLENS
    distribution: external
    manifest: app/manifest.yml
    artifacts:
      - src: app/*
        dest: ./
        processors:
          - templates
